<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>한소설 · 모바일 플레이 시안</title>
<link rel="stylesheet" href="assets/character-book-sample.css?v=4">
<script defer src="assets/character-book-sample-data.js"></script>
<script defer src="assets/character-book-sample.js?v=4"></script>
</head>
<body>
<div class="play-app">
  <header class="app-header"><div class="header-identity"><img src="assets/portrait-han.png" alt=""><div><strong>한소설</strong><span id="phase-label">역할 확인</span></div></div><div class="header-actions"><button type="button" class="demo-button" id="demo-button" aria-label="시안의 진행 단계 바꾸기">시안</button><button type="button" class="icon-button" id="cover-button" aria-label="화면 덮기"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3l18 18M10.6 6.2C16 5 21 12 21 12a19 19 0 0 1-3 3.5M6.2 6.2C4.1 8 3 12 3 12s4 6 9 6c1.3 0 2.5-.4 3.6-1M9.8 9.8a3 3 0 0 0 4.4 4.4"/></svg><span>덮기</span></button></div></header>
  <main id="book-content" tabindex="-1"></main>
  <div id="page-action" class="page-action"></div>
  <nav class="bottom-nav" aria-label="기본 메뉴">
    <button type="button" data-nav="role" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.5"/><path d="M5 21v-3a7 7 0 0 1 14 0v3"/></svg><span>내 역할</span></button>
    <button type="button" data-nav="investigate"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10" cy="10" r="6"/><path d="m15 15 6 6"/></svg><span>조사</span></button>
    <button type="button" data-nav="clues"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16v14H4zM3 3h18v4H3zM9 12h6"/></svg><span>단서함</span><i id="clue-count" hidden>1</i></button>
  </nav>
</div>
<dialog id="privacy-cover" aria-labelledby="cover-title"><div class="cover-inner"><span class="section-label">나만 보는 화면</span><div class="cover-symbol" aria-hidden="true">—</div><h2 id="cover-title">화면을 덮어두었어요.</h2><p>다시 혼자 볼 수 있을 때 이어서 읽으세요.</p><button type="button" class="primary-button" id="resume-button">읽던 곳으로 돌아가기</button></div></dialog>
<dialog id="phase-demo" aria-labelledby="demo-title"><div class="demo-inner"><span class="section-label">시안 설정</span><h2 id="demo-title">어떤 단계를 볼까요?</h2><p>실제 게임에 연결되지 않은 체험 화면입니다.<br>단계를 바꿔 첫 화면의 안내를 확인해보세요.</p><div class="demo-options" id="demo-options"></div><button type="button" class="secondary-button" id="demo-close">닫기</button></div></dialog>
<div id="sample-toast" role="status" class="toast"></div>
</body>
</html>
